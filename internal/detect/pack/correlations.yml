# Correlations across platforms. Each counts rules in this directory.
# The person a group is about is the address every platform knows them by,
# carried on each event as raw.person, or — for the sources that keep no
# address, like Duo and CloudTrail — the actor they know them by.
title: One person failed to sign in many times
id: corr.signin-failures-one-person
correlation:
    type: event_count
    rules:
        - okta.signin-failed
        - entra.signin-failed
        - workspace.signin-failed
    group-by:
        - raw.person
    timespan: 15m
    condition:
        gte: 10
level: high
---
title: One person failed to sign in on more than one platform
id: corr.signin-failures-across-platforms
correlation:
    type: value_count
    rules:
        - okta.signin-failed
        - entra.signin-failed
        - workspace.signin-failed
    group-by:
        - raw.person
    field: source
    timespan: 30m
    condition:
        gte: 2
level: high
---
title: One address failed to sign in as many people
id: corr.password-spray
correlation:
    type: value_count
    rules:
        - okta.signin-failed
        - entra.signin-failed
        - workspace.signin-failed
    group-by:
        - ip
    field: raw.person
    timespan: 30m
    condition:
        gte: 10
level: critical
---
title: One person's second factor was reset and they removed a branch protection
id: corr.identity-then-code
correlation:
    type: temporal
    rules:
        - okta.mfa-reset
        - github.branch-protection-removed
    group-by:
        - raw.person
    timespan: 24h
level: critical
---
# Deny then allow, in that order: a person pushed "no" several times and
# then said "yes". The order is the detection — approving first and denying
# the leftover prompt afterwards is the opposite of being pressured.
title: One person's second factor was denied and then allowed
id: corr.mfa-fatigue
correlation:
    type: temporal_ordered
    rules:
        - duo.push-denied
        - duo.push-allowed
    group-by:
        - actor.value
    timespan: 30m
level: high
---
# The helpdesk-vishing chain, compressed: a factor reset and then the
# sign-in it was cleared for. The reset rule fires on its own as well; this
# is the consequence that makes it worth waking somebody.
title: A second factor was reset and the account signed in
id: corr.reset-then-signin
correlation:
    type: temporal_ordered
    rules:
        - okta.mfa-reset
        - okta.signin-succeeded
    group-by:
        - raw.person
    timespan: 24h
level: high
---
# The persistence hand-off: credentials manufactured, not stolen. The base
# rules refuse the infrastructure pipeline's own user agent, so this counts
# only hands and consoles.
title: An IAM user was created and given an access key
id: corr.iam-user-then-key
correlation:
    type: temporal
    rules:
        - aws.iam-user-created
        - aws.access-key-created
    group-by:
        - actor.value
    timespan: 15m
level: high
---
# A model being told no, again and again: one refusal is the boundary
# working, ten inside fifteen minutes is a loop or a prompt that will not
# take the answer.
title: One agent's tool calls were refused in a run
id: corr.agent-refusal-burst
correlation:
    type: event_count
    rules:
        - vaigil.agent-call-denied
    group-by:
        - actor.value
    timespan: 15m
    condition:
        gte: 10
level: medium
---
# A rate, not an alarm: an agent proposing a finding every two minutes is
# either doing the backlog or running away, and both are worth a look.
title: One agent proposed findings faster than a person could read them
id: corr.agent-proposal-burst
correlation:
    type: event_count
    rules:
        - vaigil.agent-proposed
    group-by:
        - actor.value
    timespan: 1h
    condition:
        gte: 30
level: low
---
# A rate, not a call: one hundred and twenty tool calls in fifteen minutes
# is a call every seven and a half seconds without pause, where agentic
# work a person supervises has gaps — reading output, waiting on the
# model, thinking. The runaway loops this exists for (catalogue B13's
# identical-arguments loop, an exfiltration sweep) run at several calls a
# second and cross this threshold inside two of its minutes; the number
# sits above a heavy but honest coding session and below machine speed,
# and a tenant whose agents live above it tunes the threshold on the
# record rather than living with the noise.
title: One agent called tools faster than work explains
id: corr.agent-tool-burst
correlation:
    type: event_count
    rules:
        - otel.tool-call
    group-by:
        - actor.value
    timespan: 15m
    condition:
        gte: 120
level: medium
---
# Ten failed model calls in ten minutes from one agent: a revoked or
# exhausted key, a deployment pointing at a model that is gone, or a loop
# retrying what the model keeps refusing. A single failure is the
# ordinary friction of the model plane; ten inside ten minutes is an
# agent that cannot stop, and the actor the streak belongs to is the one
# to throttle.
title: One agent's model calls kept failing
id: corr.agent-model-failure-streak
correlation:
    type: event_count
    rules:
        - otel.model-call-failed
    group-by:
        - actor.value
    timespan: 10m
    condition:
        gte: 10
level: medium
# Deliberately not in this file: the watch-then-call chain — a config
# change on collector/watch followed by tool calls from the agent whose
# config it was. The two sources share no key: a watch event carries the
# recorder's device id and no actor at all, and an otel/genai event
# carries the agent's own id. No group-by exists that both legs of a
# temporal correlation could sit in — the engine drops any event missing
# its grouping field — and grouping by something both do carry, like
# source, would correlate any config change on any host with any agent's
# calls anywhere, which is false precision rather than a detection. That
# chain needs a mapping from recorder host to agent id, which is an
# onboarding feature, not a rule. Blocked the same way: heartbeat
# absence (a scheduler must notice; a falling count fires for every
# collector that never existed), first-use-of-tool (needs per-agent
# baseline state), token-spend thresholds (the store keeps per-call token
# strings, never a session total; the burst rule above is the honest rate
# proxy), and tool-argument content (nothing ships it).
