# Correlations across platforms. Each counts rules in this directory.
# The person a group is about is the address every platform knows them by,
# carried on each event as raw.person, or — for the sources that keep no
# address, like Duo and CloudTrail — the actor they know them by.
title: One person failed to sign in many times
id: corr.signin-failures-one-person
correlation:
    type: event_count
    rules:
        - okta.signin-failed
        - entra.signin-failed
        - workspace.signin-failed
    group-by:
        - raw.person
    timespan: 15m
    condition:
        gte: 10
level: high
---
title: One person failed to sign in on more than one platform
id: corr.signin-failures-across-platforms
correlation:
    type: value_count
    rules:
        - okta.signin-failed
        - entra.signin-failed
        - workspace.signin-failed
    group-by:
        - raw.person
    field: source
    timespan: 30m
    condition:
        gte: 2
level: high
---
title: One address failed to sign in as many people
id: corr.password-spray
correlation:
    type: value_count
    rules:
        - okta.signin-failed
        - entra.signin-failed
        - workspace.signin-failed
    group-by:
        - ip
    field: raw.person
    timespan: 30m
    condition:
        gte: 10
level: critical
---
title: One person's second factor was reset and they removed a branch protection
id: corr.identity-then-code
correlation:
    type: temporal
    rules:
        - okta.mfa-reset
        - github.branch-protection-removed
    group-by:
        - raw.person
    timespan: 24h
level: critical
---
# Deny then allow, in that order: a person pushed "no" several times and
# then said "yes". The order is the detection — approving first and denying
# the leftover prompt afterwards is the opposite of being pressured.
title: One person's second factor was denied and then allowed
id: corr.mfa-fatigue
correlation:
    type: temporal_ordered
    rules:
        - duo.push-denied
        - duo.push-allowed
    group-by:
        - actor.value
    timespan: 30m
level: high
---
# The helpdesk-vishing chain, compressed: a factor reset and then the
# sign-in it was cleared for. The reset rule fires on its own as well; this
# is the consequence that makes it worth waking somebody.
title: A second factor was reset and the account signed in
id: corr.reset-then-signin
correlation:
    type: temporal_ordered
    rules:
        - okta.mfa-reset
        - okta.signin-succeeded
    group-by:
        - raw.person
    timespan: 24h
level: high
---
# The persistence hand-off: credentials manufactured, not stolen. The base
# rules refuse the infrastructure pipeline's own user agent, so this counts
# only hands and consoles.
title: An IAM user was created and given an access key
id: corr.iam-user-then-key
correlation:
    type: temporal
    rules:
        - aws.iam-user-created
        - aws.access-key-created
    group-by:
        - actor.value
    timespan: 15m
level: high
---
# A model being told no, again and again: one refusal is the boundary
# working, ten inside fifteen minutes is a loop or a prompt that will not
# take the answer.
title: One agent's tool calls were refused in a run
id: corr.agent-refusal-burst
correlation:
    type: event_count
    rules:
        - vaigil.agent-call-denied
    group-by:
        - actor.value
    timespan: 15m
    condition:
        gte: 10
level: medium
---
# A rate, not an alarm: an agent proposing a finding every two minutes is
# either doing the backlog or running away, and both are worth a look.
title: One agent proposed findings faster than a person could read them
id: corr.agent-proposal-burst
correlation:
    type: event_count
    rules:
        - vaigil.agent-proposed
    group-by:
        - actor.value
    timespan: 1h
    condition:
        gte: 30
level: low
---
# A rate, not a call: one hundred and twenty tool calls in fifteen minutes
# is a call every seven and a half seconds without pause, where agentic
# work a person supervises has gaps — reading output, waiting on the
# model, thinking. The runaway loops this exists for (catalogue B13's
# identical-arguments loop, an exfiltration sweep) run at several calls a
# second and cross this threshold inside two of its minutes; the number
# sits above a heavy but honest coding session and below machine speed,
# and a tenant whose agents live above it tunes the threshold on the
# record rather than living with the noise.
title: One agent called tools faster than work explains
id: corr.agent-tool-burst
correlation:
    type: event_count
    rules:
        - otel.tool-call
    group-by:
        - actor.value
    timespan: 15m
    condition:
        gte: 120
level: medium
---
# Ten failed model calls in ten minutes from one agent: a revoked or
# exhausted key, a deployment pointing at a model that is gone, or a loop
# retrying what the model keeps refusing. A single failure is the
# ordinary friction of the model plane; ten inside ten minutes is an
# agent that cannot stop, and the actor the streak belongs to is the one
# to throttle.
title: One agent's model calls kept failing
id: corr.agent-model-failure-streak
correlation:
    type: event_count
    rules:
        - otel.model-call-failed
    group-by:
        - actor.value
    timespan: 10m
    condition:
        gte: 10
level: medium
---
# The chain this file refused for a long time (see the end of this file),
# now that the join is a declaration rather than an inference: an operator
# has mapped the recorder's host to one registered agent (vaigil agent
# maps), the watch events from that host carry the declared name, and the
# otel/genai spans carry their actor in the same field. Watch then call, in
# that order, joined on the name both halves state. Coincident, not causal
# — the agent whose config changed calling tools afterwards is also what
# an agent reloading its own configuration looks like, and what a
# developer editing a config the agent then uses looks like — so it is
# medium and triage decides, never high on the join's own say-so. An hour,
# because an agent picks up its config on its next run and a window longer
# than that starts joining changes to calls that had nothing to do with
# them.
title: An agent's configuration changed and that agent called tools
id: corr.watch-then-call
correlation:
    type: temporal_ordered
    rules:
        - collector.agent-config-changed-mapped
        - otel.tool-call
    group-by:
        - raw.agent
    timespan: 1h
level: medium
# Landed above, after a long refusal: the watch-then-call chain — a config
# change on collector/watch followed by tool calls from the agent whose
# config it was. The two sources still share no native key: a watch event
# carries the recorder's device id and no actor at all, and an otel/genai
# event carries the agent's own id, so no group-by existed that both legs
# of a temporal correlation could sit in — the engine drops any event
# missing its grouping field — and grouping by something both carry, like
# source, would correlate any config change on any host with any agent's
# calls anywhere, which is false precision rather than a detection. What
# changed is that the join key now exists as a declaration: an operator
# maps recorder hosts to registered agents (vaigil agent maps,
# internal/agentreg), the collector's ingest carries the declared names on
# each watch and heartbeat event, and the corridor above joins on the one
# field both legs then carry. Its honesty is the mapping's: a host mapped
# to more than one agent joins nothing (the closed list is not a single
# name and the program refuses to choose), an SDK whose agent id is not
# the registered name joins nothing, and a mapping change reaches forward
# to the next push only. Still deliberately not in this file: heartbeat
# absence (a scheduler must notice; a falling count fires for every
# collector that never existed), first-use-of-tool (needs per-agent
# baseline state), token-spend thresholds (the store keeps per-call token
# strings, never a session total; the tool-burst rule above is the honest
# rate proxy), and tool-argument content (nothing ships it).
---
# The lethal trifecta (catalogue B2): an agent session that read untrusted
# content, then read private data, then sent data outward — in that order.
# The sequence is the pattern the GitHub-MCP incident (a public issue's
# instructions steering private repositories out through a tool) and the
# Supabase MCP leak (root on the database, same shape) were later formalised
# from, and the ordering is what buys the precision: a session that fetched
# after it read, or sent before it read, is a different shape of work, and
# only untrusted-before-sensitive-before-egress is the hijack in order.
#
# What this is not: proof of exfiltration. A research assistant that
# legitimately reads the web, reads the repository and posts a summary does
# all three in order, and so does a report that quotes a ticket — the
# sequence is why it is high and not critical, and triage reads the session:
# which tools, what order, how many times, and whether the egress tool was
# one the agent's owner can explain.
#
# The join is the trace the events themselves carry (raw.trace_id, the OTel
# trace the SDK emitted — the session as the telemetry knows it, not a name
# the program chose), and the labels are declarations: stamped at the ingest
# boundary from the tool-label table that ships with this pack, so a tool
# the table does not name joins nothing and a table that lags a tool rename
# quietly loses a leg — the honest failure, because the alternative is
# inferring sensitivity from arguments the model treats as hostile text.
title: An agent read untrusted content, then private data, then sent data out
id: corr.lethal-trifecta
correlation:
    type: temporal_ordered
    rules:
        - otel.untrusted-read
        - otel.sensitive-read
        - otel.egress-call
    group-by:
        - raw.trace_id
    timespan: 1h
level: high
