# Dependabot, for the CI supply chain. go.mod has no require block, so there is
# nothing else to bump; the Go toolchain is watched by govulncheck in ci.yml.
# Actions are pinned to commit SHAs, and Dependabot rewrites the SHA and the
# trailing version comment together.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
    labels:
      - dependencies

  # The build stage's base image. FROM golang:1.26-bookworm resolves to a
  # moving tag, so this is what notices when the pin should move.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: build
