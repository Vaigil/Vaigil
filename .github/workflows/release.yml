name: release

# Runs on a tag, with GitHub's own token: no release key belongs to one
# person. Actions are pinned to commits; Dependabot updates them.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: The suite must pass before anything is built
        run: go test -count=1 ./...

      - name: Build
        run: |
          make build VERSION=${{ github.ref_name }}
          make build-all VERSION=${{ github.ref_name }}

      # The binary says what went into it; a dirty tree is source nobody can
      # fetch, and a require in go.mod is a dependency nobody declared.
      - name: Refuse to ship a modified build or a dependency
        run: |
          if go version -m bin/vaigil | grep -q 'vcs.modified=true'; then
            echo "the working tree was dirty"; exit 1
          fi
          if go version -m bin/vaigil | grep -q '^\s*dep\s'; then
            echo "the binary carries a third-party module"; exit 1
          fi

      - name: Checksums
        run: cd bin && sha256sum vaigil vaigil-* > SHA256SUMS

      - name: Attest the artefacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            bin/vaigil
            bin/vaigil-*

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            bin/vaigil-linux-amd64
            bin/vaigil-linux-arm64
            bin/vaigil-darwin-amd64
            bin/vaigil-darwin-arm64
            bin/vaigil-windows-amd64.exe
            bin/vaigil-windows-arm64.exe
            bin/SHA256SUMS
            LICENSE
            NOTICE
          body: |
            Every artefact here carries its SHA-256 in `SHA256SUMS`, and each
            has a build provenance attestation:
            `gh attestation verify vaigil-linux-amd64 --repo Quilzo/vaigil`.

  image:
    runs-on: ubuntu-latest
    needs: release
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Sign in to the registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Image tags drop the v: the git tag v1.2.3 publishes 1.2.3, 1.2 and latest.
      - name: Names for this image
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}

      - name: Attest the image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: The image must know its own version
        run: |
          repo=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          tag='${{ steps.meta.outputs.version }}'
          got=$(docker run --rm "ghcr.io/${repo}:${tag}" --version | head -1)
          echo "the image reports: $got"
          case "$got" in
            *"$tag"*) echo "matches ${tag}" ;;
            *) echo "::error::the image reports \"$got\" and this release is ${tag}"; exit 1 ;;
          esac

      - name: The documented quickstart must reach the console
        run: |
          repo=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          img="ghcr.io/${repo}:${{ steps.meta.outputs.version }}"
          docker run --rm -v qs:/srv "$img" --root /srv/store init --admin ci@example.com
          docker run -d --name qs -p 8080:8080 -v qs:/srv "$img"
          for _ in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/signin || true)
            [ "$code" = "200" ] && break
            sleep 2
          done
          if [ "$code" != "200" ]; then
            echo "::error::the documented quickstart does not serve the sign-in page (HTTP ${code:-none})"
            docker logs qs 2>&1 | tail -20
            exit 1
          fi
          echo "the console serves its sign-in page"
